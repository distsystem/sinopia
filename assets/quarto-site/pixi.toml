[workspace]
name = "docs"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]
description = "Self-contained Quarto docs site. Drop this directory into any project to get a working evergreen-docs library with the .compare-option filter and a site-themed draft workflow."

[dependencies]
quarto = "*"

[tasks.setup]
description = "Fetch Quarto extensions declared below. Idempotent (test -d guards)."
cmd = """
mkdir -p _extensions &&
test -d _extensions/mcanouil/quarto-iconify || quarto add --no-prompt mcanouil/quarto-iconify
"""

[tasks.preview]
description = "Live preview with hot reload on http://localhost:4850"
cmd = "quarto preview --port 4850"
depends-on = ["setup"]

[tasks.render]
description = "One-shot static build to _site/"
cmd = "quarto render"
depends-on = ["setup"]
