project:
  type: website
  execute-dir: project     # subfolder pages import figkit from docs/
  render:                  # only .qmd are pages; SKILL.md is a manifest (.md renders by default)
    - "*.qmd"
    - "*/*.qmd"
    - "skills/*/*.qmd"

website:
  title: "doc-driven-dev"
  sidebar:
    contents: auto         # single entry auto-discovers every page

filters:
  - _filters/rebase-readme-links.lua
  - _filters/compare-option.lua
  - _filters/sinopia-carrier.lua

execute:
  echo: false              # pages show the figure, not the code that draws it

format:
  html:
    theme:
      - _styles/kami.scss
