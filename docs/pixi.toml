[workspace]
name = "docs"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]
description = "Self-contained Quarto docs site. Drop this directory into any project to get a working evergreen-docs library with the .compare-option filter and a site-themed draft workflow."

[dependencies]
quarto = "*"
python = "3.13.*"      # Quarto's python engine runs the figure cells
jupyter = "*"
attrs = ">=23.1,<26"   # jupyter would pull attrs 26; stretchable caps it below 26

[pypi-dependencies]
# The project's own diagrams package, installed editable from the repo root, so figures
# render live at build time and the docs cannot drift from the code.
sinopia = { path = "..", editable = true }

[tasks.setup]
description = "Fetch Quarto extensions (best-effort; the docs render without them offline)."
cmd = """
mkdir -p _extensions &&
test -d _extensions/mcanouil/quarto-iconify || quarto add --no-prompt mcanouil/quarto-iconify || true
"""

[tasks.preview]
description = "Live preview with hot reload on http://localhost:4850"
cmd = "quarto preview --port 4850"
depends-on = ["setup"]

[tasks.render]
description = "One-shot static build to _site/"
cmd = "quarto render"
depends-on = ["setup"]
