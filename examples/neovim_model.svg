<svg class="zfig" viewBox="0 0 560 391.7" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif">
<rect x="16" y="16" width="528" height="30" rx="7" fill="#2f9e44"/><text x="280" y="37" font-size="13" fill="white" text-anchor="middle" font-weight="700">NEOVIM 模型 · 单一文本引擎 + 全局窗口</text><rect x="16" y="58" width="528" height="64" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-width="1.6"/><text x="24" y="78.5" font-size="12.5" fill="#2f9e44" text-anchor="start" font-weight="700">编辑引擎 · 模态状态机</text><text x="24" y="92" font-size="10" fill="#868e96" text-anchor="start" font-family="ui-monospace,monospace">normal ⇄ insert ⇄ visual ⇄ operator-pending ⇄ cmdline</text><text x="24" y="107.5" font-size="9.5" fill="#868e96" text-anchor="start">motion / operator / text-object 以 buffer 文本为输入;headless 无 UI 也完整运行 ciw · d/foo · >ip</text><text x="28" y="157" font-size="11" fill="#2f9e44" text-anchor="start">tabpage · 一组 window 的布局(tab 列表也是全局)</text><rect x="28" y="168.8" width="246" height="74" rx="7" fill="#2f9e44" fill-opacity="0.06" stroke="#2f9e44" stroke-width="1.6"/><text x="36" y="188.3" font-size="11.5" fill="#212529" text-anchor="start" font-weight="700">window A · winid</text><text x="36" y="202.3" font-size="9.5" fill="#868e96" text-anchor="start">视口:光标 / topline / 窗口局部选项</text><text x="36" y="218.8" font-size="10" fill="#212529" text-anchor="start" font-family="ui-monospace,monospace">→ 看 buf 3</text><rect x="286" y="168.8" width="246" height="74" rx="7" fill="#2f9e44" fill-opacity="0.06" stroke="#2f9e44" stroke-width="1.6"/><text x="294" y="188.3" font-size="11.5" fill="#212529" text-anchor="start" font-weight="700">window B · winid</text><text x="294" y="202.3" font-size="9.5" fill="#868e96" text-anchor="start">视口:光标 / topline</text><text x="294" y="218.8" font-size="10" fill="#212529" text-anchor="start" font-family="ui-monospace,monospace">→ 看 buf 7</text><rect x="16" y="266.9" width="528" height="48" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-width="1.6"/><text x="24" y="287.4" font-size="12.5" fill="#2f9e44" text-anchor="start" font-weight="700">全局 buffer-list · 持久 · bufnr 唯一</text><text x="24" y="300.4" font-size="9.5" fill="#868e96" text-anchor="start">buffer 独立于窗口存在,可被 0..N 窗口同时显示,关窗后仍作 hidden buffer 留存</text><rect x="16" y="326.9" width="78" height="24" rx="5" fill="#2f9e44" fill-opacity="0.06" stroke="#2f9e44" stroke-width="1.6"/><text x="55" y="341.4" font-size="10.5" fill="#212529" text-anchor="middle" font-family="ui-monospace,monospace">buf 1</text><rect x="126" y="326.9" width="78" height="24" rx="5" fill="#2f9e44" fill-opacity="0.06" stroke="#2f9e44" stroke-width="1.6"/><text x="165" y="341.4" font-size="10.5" fill="#212529" text-anchor="middle" font-family="ui-monospace,monospace">buf 3</text><rect x="236" y="326.9" width="78" height="24" rx="5" fill="#2f9e44" fill-opacity="0.06" stroke="#2f9e44" stroke-width="1.6"/><text x="275" y="341.4" font-size="10.5" fill="#212529" text-anchor="middle" font-family="ui-monospace,monospace">buf 7</text><rect x="346" y="326.9" width="118" height="24" rx="5" fill="#ffffff" stroke="#adb5bd" stroke-width="1.6" stroke-dasharray="3 3"/><text x="405" y="341.4" font-size="10.5" fill="#868e96" text-anchor="middle" font-family="ui-monospace,monospace">buf 9 (hidden)</text><text x="16" y="372.4" font-size="9.5" fill="#868e96" text-anchor="start">window 与 buffer 多对多;buffer 承载文本,window 只是视口。:e / :b / :split / :tabnew 改的都是这套结构。</text><defs><marker id="a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs><rect x="16" y="134" width="528" height="120.8" rx="10" fill="#2f9e44" fill-opacity="0.0" stroke="#2f9e44" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M151,242.8 L165,326.9" fill="none" stroke="#2f9e44" stroke-width="1.3" opacity="0.7" marker-end="url(#a-success)"/><path d="M409,242.8 C342,242.8 342,326.9 275,326.9" fill="none" stroke="#2f9e44" stroke-width="1.3" opacity="0.7" marker-end="url(#a-success)"/>
</svg>
