[workspace]
name = "sinopia"
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
sinopia = { path = "." }
quarto = "*"
jupyter = "*"           # Quarto's python engine runs the figure cells
attrs = ">=23.1,<26"    # jupyter would pull attrs 26; stretchable caps it below 26
fonttools = "*"
brotli = "*"

[pypi-dependencies]
stretchable = ">=1.1.8"   # PyPI-only; absent from conda-forge

[tasks.setup]
description = "Fetch Quarto extensions (best-effort; the docs render without them offline)."
cwd = "docs"
cmd = """
mkdir -p _extensions &&
test -d _extensions/mcanouil/iconify || quarto add --no-prompt mcanouil/quarto-iconify || true
"""

[tasks.render]
description = "One-shot static build to _site/"
cwd = "docs"
cmd = "quarto render"
depends-on = ["setup"]

[tasks.open]
description = "Render, then open the static site in the browser (file://, no server)"
cmd = "xdg-open docs/_site/index.html"
depends-on = ["render"]

[tasks.make-fonts]
description = "Regenerate LXGW WenKai woff2 from the installed TTF → docs/fonts/ (re-run on LXGW updates; upload output to the webfont CDN host)"
cmd = "python docs/_tools/ttf2woff2.py"

[tasks.link-skill]
description = "Symlink one skill (docs/<name>) into ~/.claude/skills"
args = ["name"]
cmd = """
mkdir -p $HOME/.claude/skills
ln -sfn $PIXI_PROJECT_ROOT/docs/skills/{{ name }} $HOME/.claude/skills/{{ name }}
"""

[tasks.link-skills]
description = "Symlink this project's skills into ~/.claude/skills — a dynamic global install"
depends-on = [
  { task = "link-skill", args = ["sinopia"] },
  { task = "link-skill", args = ["doc-driven-dev"] },
]

[package]
name = "sinopia"
version = "0.4.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies]
python = ">=3.9,<3.14"
setuptools = ">=68"

[package.run-dependencies]
python = ">=3.9,<3.14"
pydantic = ">=2"
