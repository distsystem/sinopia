[workspace]
name = "sinopia"
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
sinopia = { path = "." }
quarto = "*"
jupyter = "*"           # Quarto's python engine runs the figure cells
attrs = ">=23.1,<26"    # jupyter would pull attrs 26; stretchable caps it below 26

[pypi-dependencies]
stretchable = ">=1.1.8"   # PyPI-only; absent from conda-forge

[tasks.setup]
description = "Fetch Quarto extensions (best-effort; the docs render without them offline)."
cwd = "docs"
cmd = """
mkdir -p _extensions &&
test -d _extensions/mcanouil/quarto-iconify || quarto add --no-prompt mcanouil/quarto-iconify || true
"""

[tasks.render]
description = "One-shot static build to _site/"
cwd = "docs"
cmd = "quarto render"
depends-on = ["setup"]

[tasks.open]
description = "Render, then open the static site in the browser (file://, no server)"
cmd = "xdg-open docs/_site/index.html"
depends-on = ["render"]

[package]
name = "sinopia"
version = "0.4.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies]
python = ">=3.9,<3.14"
setuptools = ">=68"

[package.run-dependencies]
python = ">=3.9,<3.14"
pydantic = ">=2"
