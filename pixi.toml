[workspace]
name = "sinopia"
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
sinopia = { path = "." }
quarto = "*"
jupyter = "*"           # Quarto's python engine runs the figure cells
attrs = ">=23.1,<26"    # jupyter would pull attrs 26; stretchable caps it below 26

[pypi-dependencies]
stretchable = ">=1.1.8"   # PyPI-only; absent from conda-forge

[tasks]
channels = "python examples/channels.py"
neovim-model = "python examples/neovim_model.py"

[tasks.setup]
description = "Fetch Quarto extensions (best-effort; the docs render without them offline)."
cwd = "docs"
cmd = """
mkdir -p _extensions &&
test -d _extensions/mcanouil/quarto-iconify || quarto add --no-prompt mcanouil/quarto-iconify || true
"""

[tasks.preview]
description = "Live preview with hot reload on http://localhost:4850"
cwd = "docs"
cmd = "quarto preview --port 4850"
depends-on = ["setup"]

[tasks.render]
description = "One-shot static build to _site/"
cwd = "docs"
cmd = "quarto render"
depends-on = ["setup"]

[package]
name = "sinopia"
version = "0.3.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies]
python = ">=3.9,<3.14"
setuptools = ">=68"

[package.run-dependencies]
python = ">=3.9,<3.14"
pydantic = ">=2"
