[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinopia"
version = "0.3.0"
description = "Diagrams as code: themed inline SVG with computed connectors and declarative layout."
requires-python = ">=3.9,<3.14"
dependencies = ["stretchable>=1.1.8", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
sinopia = { path = ".", editable = true }

[tool.pixi.tasks]
channels = "python examples/channels.py"
neovim-model = "python examples/neovim_model.py"
